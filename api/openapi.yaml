        - role
        - source_task_id
        - taxonomy_code
        - voice_instruction
      type: object
    voicehttp.SynthesizeRequest:
      additionalProperties: false
      properties:
        text:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - text
      type: object
    voicehttp.Transcription:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        id:
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - text
      type: object
  securitySchemes:
    accessCookie:
      in: cookie
      name: access_token
      type: apiKey
    refreshCookie:
      in: cookie
      name: refresh_token
      type: apiKey
info:
  description: 'Единый API Geek: implemented — подключённые операции, planned — будущие операции. Курс строится из материалов; диагностика — устный экзамен по графу курса. Даты — Unix seconds; cookies Secure/HttpOnly.'
