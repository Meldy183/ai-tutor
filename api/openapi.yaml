      summary: Собрать граф курса
      tags:
        - Материалы
      x-implementation: implemented
  /exam/admin/subjects/{subject_id}/graph/competency-map:
    post:
      description: 'Доступно только admin. Карта компетенций загружается одной двухлистовой книгой: первый лист — экзамена Geek, второй — учебной диагностики; другой формат отклоняется (UNIFIED_COMPETENCY_MAP_REQUIRED). Листы сопоставляются по компетенции, составляющей и ОР; структура курса сохраняется один раз в новой ревизии карты, а задания каждого листа — как задания своего режима при тех же ОР. Учебная ревизия становится активной в той же транзакции, сборка графа Geek ставится в очередь; до её успешного завершения Geek работает по прежнему опубликованному графу, ошибка сборки не отключает обучение. Граф обоих режимов строится одним правилом: на каждую составляющую с тремя и более ОР с TRUE и заданием основное ОР (наивысший Блум, затем важность) — тема верхнего уровня, два самых простых — её пререквизиты; все колонки «Задание N» листа Geek — варианты темы с критериями той же колонки.'
      operationId: importCourseGraphCompetencyMap
      parameters:
        - description: ID предмета
          in: path
          name: subject_id
          required: true
          schema:
            type: string
        - description: 'Активная ревизия карты из GET /learn/subjects/{subject_id}/competency-map (0 — карты ещё нет): подтверждает замену'
          in: header
          name: X-Expected-Learning-Revision
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  description: Карта компетенций .xlsx, до 25 МиБ
                  format: binary
                  type: string
              required:
                - file
              type: object
        description: Карта компетенций .xlsx, до 25 МиБ
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coursegraph.Snapshot'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: GRAPH_BUILD_IN_PROGRESS или COMPETENCY_MAP_CHANGED
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: UNIFIED_COMPETENCY_MAP_REQUIRED, COMPETENCY_MAP_INVALID, COMPETENCY_MAP_EMPTY или COMPETENCY_MAP_STRUCTURE_MISMATCH
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Импортировать карту компетенций
      tags:
        - Материалы
      x-implementation: implemented
  /exam/admin/subjects/{subject_id}/graph/competency-map/retry:
    post:
      description: Доступно только admin после окончательного сбоя подготовки карты. Ставит сохранённую карту в очередь без повторного импорта и без изменения заданий. Fingerprint проверяется атомарно. Материалы PDF не требуются; опубликованный граф сохраняется до успешной подготовки.
      operationId: retryCourseGraphMap
      parameters:
        - description: ID предмета
          in: path
          name: subject_id
          required: true
          schema:
            type: string
        - description: Fingerprint сохранённой карты из последнего snapshot
          in: header
          name: X-Expected-Map-Fingerprint
          required: true
          schema:
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/coursegraph.Snapshot'
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
