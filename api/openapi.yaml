components:
  schemas:
    app.HealthResponse:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    application.CriterionResult:
      additionalProperties: false
      properties:
        explanation:
          type: string
        key:
          type: string
        satisfied:
          type: boolean
      required:
        - explanation
        - key
        - satisfied
      type: object
    assessmenthttp.EvaluateRequest:
      additionalProperties: false
      properties:
        transcription_id:
          maxLength: 128
          minLength: 1
          type: string
        variant_id:
          maxLength: 128
          minLength: 1
          type: string
        variant_task_id:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - transcription_id
        - variant_id
        - variant_task_id
      type: object
    assessmenthttp.EvaluateResponse:
      additionalProperties: false
      properties:
        criterion_results:
          items:
            $ref: '#/components/schemas/application.CriterionResult'
          type: array
          uniqueItems: false
        feedback:
          type: string
        max_score:
          maximum: 3
          minimum: 1
          type: integer
        score:
          maximum: 3
          minimum: 0
          type: integer
        verdict:
          enum:
            - correct
            - partial
            - incorrect
          type: string
      required:
        - criterion_results
        - feedback
        - max_score
        - score
        - verdict
      type: object
    audiopreparation.Exam:
      additionalProperties: false
      properties:
        failed:
          type: integer
        observed_at:
          type: string
        processing:
          type: integer
        published:
          type: boolean
        queued:
          type: integer
        ready:
          type: integer
        retry_wait:
          type: integer
        state:
          $ref: '#/components/schemas/audiopreparation.State'
        total:
          type: integer
        unavailable:
          type: integer
        unchecked:
          type: integer
        version:
          type: string
      required:
        - failed
        - observed_at
        - processing
        - published
        - queued
        - ready
        - retry_wait
        - state
        - total
        - unavailable
        - unchecked
        - version
      type: object
    audiopreparation.Learning:
      additionalProperties: false
      properties:
        failed:
          type: integer
        observed_at:
          type: string
        processing:
          type: integer
        queued:
          type: integer
        ready:
          type: integer
        retry_wait:
          type: integer
        revision:
          type: integer
        state:
          $ref: '#/components/schemas/audiopreparation.State'
        total:
          type: integer
        unavailable:
          type: integer
        unchecked:
          type: integer
        version:
          type: string
      required:
        - failed
        - observed_at
        - processing
        - queued
        - ready
        - retry_wait
        - revision
        - state
        - total
        - unavailable
        - unchecked
        - version
      type: object
    audiopreparation.Response:
      additionalProperties: false
      properties:
        exam:
          anyOf:
            - $ref: '#/components/schemas/audiopreparation.Exam'
            - type: "null"
        learn:
          anyOf:
            - $ref: '#/components/schemas/audiopreparation.Learning'
            - type: "null"
        subject_id:
          type: string
      required:
        - exam
        - learn
        - subject_id
      type: object
    audiopreparation.State:
      enum:
        - no_graph
        - checking
        - queued
        - processing
        - retry_wait
        - partial
        - ready
        - empty
      type: string
      x-enum-varnames:
        - NoGraph
        - Checking
        - Queued
        - Processing
        - RetryWait
        - Partial
        - Ready
        - Empty
    authhttp.LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    authhttp.RegisterRequest:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 200
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 4
          type: string
      required:
        - display_name
        - email
        - password
      type: object
    authhttp.authSession:
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/authhttp.wireExpiry'
        user:
          $ref: '#/components/schemas/authhttp.wireUser'
      required:
        - session
        - user
      type: object
    authhttp.wireExpiry:
      additionalProperties: false
      properties:
        access_expires_at:
          type: integer
        refresh_expires_at:
          type: integer
      required:
        - access_expires_at
        - refresh_expires_at
      type: object
    authhttp.wireUser:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/user.Role'
      required:
        - created_at
        - display_name
        - email
        - id
        - role
      type: object
    competencyhttp.Competency:
      additionalProperties: false
      properties:
        constituents:
          items:
            $ref: '#/components/schemas/competencyhttp.Constituent'
          type: array
          uniqueItems: false
        id:
          type: string
        name:
          type: string
      required:
        - constituents
        - id
        - name
      type: object
    competencyhttp.Constituent:
      additionalProperties: false
      properties:
        curriculum_sections:
          items:
            $ref: '#/components/schemas/competencyhttp.CurriculumSection'
          type: array
          uniqueItems: false
        id:
          type: string
        name:
          type: string
        outcomes:
          items:
            $ref: '#/components/schemas/competencyhttp.Outcome'
          type: array
          uniqueItems: false
        topic_level_code:
          type:
            - string
            - "null"
      required:
        - curriculum_sections
        - id
        - name
        - outcomes
        - topic_level_code
      type: object
    competencyhttp.CurriculumSection:
      additionalProperties: false
      properties:
        code:
          type: string
        curriculum_competencies:
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
      required:
        - code
        - curriculum_competencies
        - title
      type: object
    competencyhttp.MapSnapshot:
      additionalProperties: false
      properties:
        competencies:
          items:
            $ref: '#/components/schemas/competencyhttp.Competency'
          type: array
          uniqueItems: false
        imported_at:
          type:
            - integer
            - "null"
        revision:
          type: integer
      required:
        - competencies
        - imported_at
        - revision
      type: object
    competencyhttp.Outcome:
      additionalProperties: false
      properties:
        ald_level_code:
          type:
            - string
            - "null"
        educational_content:
          type:
            - string
            - "null"
        id:
          type: string
        importance:
          type:
            - integer
            - "null"
        include_in_test:
          type:
            - boolean
            - "null"
        name:
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/competencyhttp.Task'
          type: array
          uniqueItems: false
        taxonomy_code:
          type:
            - string
            - "null"
      required:
        - ald_level_code
        - educational_content
        - id
        - importance
        - include_in_test
        - name
        - tasks
        - taxonomy_code
      type: object
    competencyhttp.Task:
      additionalProperties: false
      properties:
        id:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        question:
          type: string
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - id
        - options
        - origin
        - question
        - voice_instruction
      type: object
    coursegraph.BuildProgress:
      additionalProperties: false
      properties:
        done:
          type: integer
        remaining_seconds:
          type: integer
        stage:
          enum:
            - topics
            - synonyms
            - prerequisites
            - attach
            - questions
            - prepare_questions
            - retry_questions
            - publish
          type: string
        stage_count:
          type: integer
        stage_index:
          type: integer
        total:
          type: integer
      required:
        - done
        - stage
        - stage_count
        - stage_index
        - total
      type: object
    coursegraph.ImportWarning:
      additionalProperties: false
      properties:
        code:
          type: string
        column:
          type: string
        column_index:
          type: integer
        row:
          type: integer
      required:
        - code
        - column
        - column_index
        - row
      type: object
    coursegraph.MapFile:
      additionalProperties: false
      properties:
        filename:
          type: string
        fingerprint:
          type: string
        learning_revision:
          type:
            - integer
            - "null"
        sheet:
          type: string
      required:
        - filename
        - fingerprint
        - learning_revision
        - sheet
      type: object
    coursegraph.Snapshot:
      additionalProperties: false
      properties:
        attempts:
          type: integer
        build_source:
          description: |-
            BuildSource is what the last requested build reads: materials or
            competency_map; null before the first request.
          enum:
            - materials
            - competency_map
            - null
          type:
            - string
            - "null"
        error_message:
          type: string
        graph:
          type:
            - object
            - "null"
        graph_fingerprint:
          description: GraphFingerprint identifies the currently published Geek graph.
          type: string
        graph_map_revision:
          description: GraphMapRevision is the learning-map revision used to build the published Geek graph.
          type:
            - integer
            - "null"
        graph_source:
          enum:
            - built
            - competency_map
            - none
          type: string
        inputs_ready:
          type: boolean
        learning_warnings:
          description: |-
            LearningWarnings are parser warnings from the second sheet of the
            just-imported paired workbook; they are not persisted in the map snapshot.
          items:
            $ref: '#/components/schemas/coursegraph.ImportWarning'
          type: array
          uniqueItems: false
        map:
          anyOf:
            - $ref: '#/components/schemas/coursegraph.MapFile'
            - type: "null"
          description: Map is the imported competency map, if any.
        progress:
          anyOf:
            - $ref: '#/components/schemas/coursegraph.BuildProgress'
            - type: "null"
          description: |-
            Progress is where a running build is; only while Status is processing.
            It lives in API memory, so after a restart it returns with the next poll.
        stale:
          type: boolean
        status:
          enum:
            - not_requested
            - pending
            - processing
            - ready
            - failed
          type: string
        updated_at:
          type: integer
      required:
        - attempts
        - build_source
        - error_message
        - graph
        - graph_fingerprint
        - graph_map_revision
        - graph_source
        - inputs_ready
        - learning_warnings
        - map
        - progress
        - stale
        - status
        - updated_at
      type: object
    diagnostichttp.AnswerResponse:
      additionalProperties: false
      properties:
        competency_id:
          type: string
        created_at:
          type: integer
        criterion_results:
          items:
            $ref: '#/components/schemas/diagnostichttp.CriterionResultResponse'
          type: array
          uniqueItems: false
        feedback:
          type: string
        grader_max_score:
          maximum: 3
          minimum: 1
          type: integer
        grader_score:
          maximum: 3
          minimum: 0
          type: integer
        outcome_id:
          type: string
        role:
          enum:
            - main
            - basic
          type: string
        score:
          maximum: 3
          minimum: 0
          type: integer
        skipped:
          type: boolean
        source_task_id:
          type: string
        task:
          $ref: '#/components/schemas/diagnostichttp.TaskResponse'
        text:
          type: string
        transcription_id:
          type: string
        variant_task_id:
          type: string
        verdict:
          enum:
            - correct
            - partial
            - incorrect
          type: string
      required:
        - competency_id
        - created_at
        - criterion_results
        - feedback
        - grader_max_score
        - grader_score
        - outcome_id
        - role
        - score
        - source_task_id
        - task
        - text
        - transcription_id
        - variant_task_id
        - verdict
      type: object
    diagnostichttp.AudioMetadataResponse:
      additionalProperties: false
      properties:
        audio_url:
          type:
            - string
            - "null"
        status:
          enum:
            - missing
            - pending
            - processing
            - ready
            - failed
            - cancelled
          type: string
        variant_task_id:
          type: string
      required:
        - audio_url
        - status
        - variant_task_id
      type: object
    diagnostichttp.AudioRegenerationRequest:
      additionalProperties: false
      properties:
        variant_task_id:
          type: string
      required:
        - variant_task_id
      type: object
    diagnostichttp.CriterionResultResponse:
      additionalProperties: false
      properties:
        explanation:
          type: string
        key:
          type: string
        satisfied:
          type: boolean
      required:
        - explanation
        - key
        - satisfied
      type: object
    diagnostichttp.LearningStateResponse:
      additionalProperties: false
      properties:
        active_session_id:
          type: string
        diagnostic_completed:
          type: boolean
        diagnostic_session_id:
          type: string
        diagnostic_status:
          type: string
        subject_id:
          type: string
        subject_name:
          type: string
        training_available:
          type: boolean
      required:
        - diagnostic_completed
        - diagnostic_status
        - subject_id
        - subject_name
        - training_available
      type: object
    diagnostichttp.ProgressResponse:
      additionalProperties: false
      properties:
        answer_skipped:
          type: boolean
        competency_count:
          minimum: 1
          type: integer
        completed_tasks:
          minimum: 0
          type: integer
        criterion_results:
          items:
            $ref: '#/components/schemas/diagnostichttp.CriterionResultResponse'
          type: array
          uniqueItems: false
        current:
          $ref: '#/components/schemas/diagnostichttp.TaskResponse'
        current_competency:
          minimum: 1
          type: integer
        current_step:
          maximum: 2
          minimum: 0
          type: integer
        feedback:
          type: string
        grader_max_score:
          maximum: 3
          minimum: 1
          type: integer
        grader_score:
          maximum: 3
          minimum: 0
          type: integer
        score:
          maximum: 3
          minimum: 0
          type: integer
        session_id:
          maxLength: 128
          minLength: 1
          type: string
        skipped_tasks:
          minimum: 0
          type: integer
        status:
          enum:
            - active
            - completed
          type: string
        text:
          minLength: 1
          type: string
        total_tasks:
          minimum: 1
          type: integer
        verdict:
          enum:
            - correct
            - partial
            - incorrect
          type: string
      required:
        - completed_tasks
        - session_id
        - skipped_tasks
        - status
        - total_tasks
      type: object
    diagnostichttp.ResultResponse:
      additionalProperties: false
      properties:
        answers:
          items:
            $ref: '#/components/schemas/diagnostichttp.AnswerResponse'
          type: array
          uniqueItems: false
        completed_tasks:
          type: integer
        diagnostic_score:
          type: integer
        grade:
          description: Предварительная оценка A–D по проценту нормализованных баллов (от 90 — A, от 70 — B, от 60 — C); null — нет заданных заданий
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        included_competency_count:
          type: integer
        map_revision:
          type: integer
        maximum_score:
          type: integer
        report_max_score:
          description: 'Максимум нормализованных баллов: 5 на компетенцию'
          minimum: 0
          type: integer
        report_score:
          description: 'Сумма нормализованных баллов итогового экрана: каждая компетенция весит 5 баллов, с одним знаком после запятой'
          minimum: 0
          type: number
        score_percent:
          description: Процент нормализованных баллов от максимума
          maximum: 100
          minimum: 0
          type:
            - integer
            - "null"
        session_id:
          type: string
        skipped_competencies:
          items:
            $ref: '#/components/schemas/diagnostichttp.SkippedCompetencyResponse'
          type: array
          uniqueItems: false
        status:
          enum:
            - completed
          type: string
        total_tasks:
          type: integer
        training_needed:
          description: 'Есть компетенция ниже 90%: только такие идут в обучение'
          type: boolean
        untested_basics:
          items:
            $ref: '#/components/schemas/diagnostichttp.TaskResponse'
          type: array
          uniqueItems: false
        variant_id:
          type: string
      required:
        - answers
        - completed_tasks
        - diagnostic_score
        - grade
        - included_competency_count
        - map_revision
        - maximum_score
        - report_max_score
        - report_score
        - score_percent
        - session_id
        - skipped_competencies
        - status
        - total_tasks
        - training_needed
        - untested_basics
        - variant_id
      type: object
    diagnostichttp.SkipRequest:
      additionalProperties: false
      properties:
        variant_task_id:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - variant_task_id
      type: object
    diagnostichttp.SkippedCompetencyResponse:
      additionalProperties: false
      properties:
        code:
          type: string
        competency_id:
          type: string
        competency_name:
          type: string
      required:
        - code
        - competency_id
        - competency_name
      type: object
    diagnostichttp.StartRequest:
      additionalProperties: false
      properties:
        variant_id:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - variant_id
      type: object
    diagnostichttp.TaskResponse:
      additionalProperties: false
      properties:
        competency_id:
          maxLength: 128
          minLength: 1
          type: string
        competency_name:
          type: string
        constituent_id:
          maxLength: 128
          minLength: 1
          type: string
        constituent_name:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        outcome_id:
          maxLength: 128
          minLength: 1
          type: string
        outcome_name:
          type: string
        question:
          minLength: 1
          type: string
        role:
          enum:
            - main
            - basic
          type: string
        source_task_id:
          maxLength: 128
          minLength: 1
          type: string
        variant_task_id:
          maxLength: 128
          minLength: 1
          type: string
        voice_instruction:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - competency_id
        - competency_name
        - constituent_id
        - constituent_name
        - options
        - outcome_id
        - outcome_name
        - question
        - role
        - source_task_id
        - variant_task_id
        - voice_instruction
      type: object
    diagnostichttp.TranscriptionAnswerRequest:
      additionalProperties: false
      properties:
        transcription_id:
          maxLength: 128
          minLength: 1
          type: string
        variant_task_id:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - transcription_id
        - variant_task_id
      type: object
    fault.Detail:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - code
        - message
      type: object
    fault.Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/fault.Detail'
          type: array
          uniqueItems: false
        message:
          type: string
      required:
        - code
        - message
      type: object
    geek.AnswerRequest:
      additionalProperties: false
      properties:
        dont_know:
          description: 'Кнопка «Не знаю» без оценки моделью: на основной вопрос или переформулировку — пробел, на дополнительный — К3 и К4 на 0'
          type: boolean
        text:
          description: Текстовый ответ
          maxLength: 4000
          minLength: 1
          type: string
        transcription_id:
          description: Расшифровка из POST /voice/transcriptions, подтверждённая студентом
          minLength: 1
          type: string
        turn_id:
          description: current_turn_id сессии
          minLength: 1
          type: string
      required:
        - turn_id
      type: object
    geek.CoverageItem:
      additionalProperties: false
      properties:
        criteria:
          anyOf:
            - $ref: '#/components/schemas/geek.Criteria'
            - type: "null"
        evidence_lines:
          items:
            description: Строки транскрипта, на которых основан вывод
            minimum: 1
            type: integer
          type: array
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        node_id:
          type: string
        status:
          $ref: '#/components/schemas/geek.NodeStatus'
        title:
          type: string
        top_level:
          description: 'Вершина верхнего уровня: не пререквизит ни одной другой'
          type: boolean
      required:
        - criteria
        - evidence_lines
        - grade
        - node_id
        - status
        - title
        - top_level
      type: object
    geek.Criteria:
      additionalProperties: false
      description: К1 корректность и терминология, К2 логика и обоснование, К3 возражения и контрпримеры, К4 изменённые условия; 0/1/2
      properties:
        k1:
          maximum: 2
          minimum: 0
          type: integer
        k2:
          maximum: 2
          minimum: 0
          type: integer
        k3:
          maximum: 2
          minimum: 0
          type: integer
        k4:
          maximum: 2
          minimum: 0
          type: integer
      required:
        - k1
        - k2
        - k3
        - k4
      type: object
    geek.Gap:
      additionalProperties: false
      properties:
        learning_materials:
          $ref: '#/components/schemas/geek.LearningMaterials'
        node_id:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/geek.SourceCitation'
          type: array
          uniqueItems: false
        title:
          type: string
        weeks:
          items:
            type: integer
          type: array
          uniqueItems: false
      required:
        - learning_materials
        - node_id
        - sources
        - title
        - weeks
      type: object
    geek.GraphBuild:
      additionalProperties: false
      description: Последняя сборка графа курса. Даты — Unix seconds.
      properties:
        error:
          type:
            - string
            - "null"
        finished_at:
          type:
            - integer
            - "null"
        stage:
          anyOf:
            - $ref: '#/components/schemas/geek.GraphBuildStage'
            - type: "null"
        started_at:
          type: integer
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
          type: string
      required:
        - error
        - finished_at
        - stage
        - started_at
