      description: Backend синтезирует реплику Geek через TTS и кэширует WAV в S3; длина реплики не ограничена лимитом /voice/syntheses. Без part — вся реплика; part=reply — только реакция на прошлый ответ (поле reply), part=question — вопрос или завершение после неё. Части кэшируются по тексту, поэтому заранее подготовленный вопрос синтезируется один раз для всех студентов. 404 — реплика студента, чужая сессия или пустая часть (TURN_PART_NOT_FOUND).
      operationId: getDiagnosticTurnAudio
      parameters:
        - description: ID диагностики
          in: path
          name: id
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
        - description: ID реплики Geek
          in: path
          name: turn_id
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
        - description: Часть реплики
          in: query
          name: part
          schema:
            enum:
              - intro
              - reply
              - transition
              - question
            type: string
        - description: Номер блока фидбека с нуля, только part=reply
          in: query
          name: chunk
          schema:
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            audio/wav:
              schema:
                format: binary
                type: string
          description: WAV реплики
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "404":
          content:
