          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Граф курса и состояние построения
      tags:
        - Материалы
      x-implementation: implemented
  /exam/admin/subjects/{subject_id}/graph/build:
    get:
